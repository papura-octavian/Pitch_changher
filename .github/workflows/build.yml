name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # required to create the GitHub Release and attach assets

jobs:
  windows:
    name: Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Download FFmpeg
        run: python scripts/get_ffmpeg.py

      - name: Build executable with PyInstaller
        run: pyinstaller --clean --noconfirm Pitch_Changher.spec

      - name: Get version from tag
        id: get_version
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/v(.+)') {
            $version = $matches[1]
          } else {
            $version = "dev"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup is preinstalled on the runner)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.get_version.outputs.version }} installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PitchShifter-Windows-Installer
          path: installer/*.exe
          retention-days: 30

      - name: Attach to release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
