name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    name: Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Download FFmpeg
        run: python scripts/get_ffmpeg.py

      - name: Build executable with PyInstaller
        run: pyinstaller --clean --noconfirm Pitch_Changher.spec

      - name: Get version from tag
        id: get_version
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/v(.+)') {
            $version = $matches[1]
          } else {
            $version = "dev"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup is preinstalled on the runner)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.get_version.outputs.version }} installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PitchShifter-Windows-Installer
          path: installer/*.exe
          retention-days: 30

      - name: Attach to release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfuse2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Download FFmpeg (static build)
        run: python scripts/get_ffmpeg.py

      - name: Build executable with PyInstaller
        run: pyinstaller --clean --noconfirm Pitch_Changher.spec

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/PitchShifter AppDir/usr/bin/
          cp -r ffmpeg AppDir/usr/ffmpeg
          cp icons/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/pitchshifter.png
          cp icons/icon.png AppDir/pitchshifter.png

          cat > AppDir/usr/share/applications/pitchshifter.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=PitchShifter
          Comment=Pitch shifting tool for audio and video files
          Exec=PitchShifter
          Icon=pitchshifter
          Categories=AudioVideo;Audio;Video;
          Terminal=false
          EOF
          cp AppDir/usr/share/applications/pitchshifter.desktop AppDir/pitchshifter.desktop

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF="$(readlink -f "${0}")"
          HERE="$(dirname "${SELF}")"
          exec "${HERE}/usr/bin/PitchShifter" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="dev"
          fi
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir PitchShifter-${VERSION}-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: PitchShifter-Linux-AppImage
          path: PitchShifter-*.AppImage
          retention-days: 30

      - name: Attach to release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PitchShifter-*.AppImage
